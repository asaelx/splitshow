<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>splitshow</title>
  <link rel="stylesheet" href="player.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage { width: 100%; height: 100%; }

    #yt-player {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    @keyframes scroll-title {
      0%   { transform: translateX(0); }
      100% { transform: translateX(var(--scroll-dist)); }
    }

    #music-bar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-family: monospace;
      font-size: 0.8rem;
    }

    #music-bar img {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      filter: invert(1);
      opacity: 0.85;
    }

    #music-title-wrap {
      overflow: hidden;
      max-width: 260px;
    }

    #music-title {
      white-space: nowrap;
      opacity: 0.9;
      display: inline-block;
    }

    #music-title.scrolling {
      animation: scroll-title linear infinite;
    }

    #music-time {
      flex-shrink: 0;
      opacity: 0.6;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="yt-player"></div>

  <div id="music-bar">
    <img src="/icons/music.svg" alt="music">
    <div id="music-title-wrap"><span id="music-title"></span></div>
    <span id="music-time">0:00 / 0:00</span>
  </div>

  <script type="module">
    import { mountPlayer } from "./player.mjs";

    let isPaused = true;
    // ── Background music ──────────────────────────────────────────────────────

    let ytPlayer = null;
    let ytReady = false;
    let audioEl = null;

    const musicBar  = document.getElementById('music-bar');
    const musicTitle = document.getElementById('music-title');
    const musicTime  = document.getElementById('music-time');

    function fmtTime(s) {
      if (!isFinite(s) || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    }

    const musicTitleWrap = document.getElementById('music-title-wrap');

    function setTrack(filename) {
      audioEl.src = `/music/${encodeURIComponent(filename)}`;
      musicTitle.textContent = filename.replace(/\.[^.]+$/, '');
      musicTime.textContent = '0:00 / 0:00';
      musicTitle.classList.remove('scrolling');
      musicTitle.style.removeProperty('--scroll-dist');
      musicTitle.style.removeProperty('animation-duration');
      requestAnimationFrame(() => {
        const overflow = musicTitle.scrollWidth - musicTitleWrap.clientWidth;
        if (overflow > 0) {
          const duration = 2 + overflow / 40;
          musicTitle.style.setProperty('--scroll-dist', `-${overflow + 16}px`);
          musicTitle.style.animationDuration = `${duration}s`;
          musicTitle.style.animationDelay = '1.5s';
          musicTitle.classList.add('scrolling');
        }
      });
    }

    function initLocalMusic(tracks) {
      if (!tracks || tracks.length === 0) return;
      function pickTrack() {
        return tracks[Math.floor(Math.random() * tracks.length)];
      }
      audioEl = document.createElement('audio');
      audioEl.addEventListener('timeupdate', () => {
        musicTime.textContent = `${fmtTime(audioEl.currentTime)} / ${fmtTime(audioEl.duration)}`;
      });
      audioEl.addEventListener('ended', () => {
        setTrack(pickTrack());
        if (!isPaused) audioEl.play().catch(() => {});
      });
      setTrack(pickTrack());
      musicBar.style.display = 'flex';
    }

    function initYouTube(videoId) {
      if (!videoId) return;
      window.onYouTubeIframeAPIReady = function () {
        ytPlayer = new YT.Player('yt-player', {
          videoId,
          playerVars: {
            autoplay: 0,
            controls: 0,
            loop: 1,
            playlist: videoId,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            modestbranding: 1,
          },
          events: {
            onReady: () => { ytReady = true; },
          },
        });
      };
      const ytScript = document.createElement('script');
      ytScript.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(ytScript);
    }

    async function init() {
      const res = await fetch('/api/media');
      if (!res.ok) throw new Error('Could not load media.');
      const { media, imageDuration, musicTracks, musicId } = await res.json();
      if (musicTracks?.length) initLocalMusic(musicTracks);
      else initYouTube(musicId);

      mountPlayer(document.getElementById('stage'), media.map(item => ({
        type: item.type,
        url: `/media/${encodeURIComponent(item.name)}`
      })), {
        rows: 1,
        imageDuration,
        onPauseChange(paused) {
          isPaused = paused;
          if (ytReady) {
            if (paused) ytPlayer.pauseVideo();
            else ytPlayer.playVideo();
          }
          if (audioEl) {
            if (paused) audioEl.pause();
            else audioEl.play().catch(() => {});
          }
        }
      });
    }

    init().catch(error => {
      document.getElementById('stage').textContent = error.message;
    });
  </script>
</body>
</html>
